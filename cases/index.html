<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="落点 AI 业务方案库：193 篇行业方案，覆盖制造、零售、物流、专业服务等常见业务。" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="data:," />
    <title>企业业务方案库 · 落点 AI</title>
  </head>
  <body>
    <!-- All records are scenario studies, not client-result claims. -->
    <a class="skip-link" href="#main">跳至主要内容</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/">落点 <span>AI</span></a>
        <span class="brand-caption">企业流程改进与 AI 应用</span>
        <nav class="primary-nav" aria-label="主导航">
          <a href="/">官网</a>
          <a href="/demos/">行业体验台</a>
          <a href="/cases/" data-route data-nav="library">案例库</a>
          <a href="/about/">关于我们</a>
        </nav>
        <button class="button contact-button" data-contact>咨询项目 <i data-lucide="arrow-up-right"></i></button>
      </div>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="site-footer">
      <div class="footer-inner"><a href="/" class="brand">落点 <span>AI</span></a><p>从业务问题出发，让技术有据可依。</p><div class="footer-contact"><a href="tel:17753953684">电话 177 5395 3684</a><a href="mailto:pardus.team.william@gmail.com">pardus.team.william@gmail.com</a><span>微信 sopia101</span></div><span>场景研究 / 行业方案</span></div>
    </footer>
    <dialog id="contact-dialog" aria-labelledby="contact-title">
      <div class="dialog-header"><span class="eyebrow">PROJECT ENQUIRY</span><button class="icon-button" data-close-dialog aria-label="关闭咨询" title="关闭咨询"><i data-lucide="x"></i></button></div>
      <h2 id="contact-title">讨论一个具体问题</h2>
      <p class="muted">简单写下现状和最希望解决的问题。</p>
      <form id="contact-form">
        <label>企业或团队<input name="company" autocomplete="organization" required maxlength="100" /></label>
        <label>希望改善的流程<textarea name="workflow" rows="4" required maxlength="2000"></textarea></label>
        <label>联系方式（选填）<input name="contact" autocomplete="email" maxlength="150" /></label>
        <p class="caption">填写后直接发送到我们的邮箱，我们会尽快联系你。</p>
        <button class="button solid" type="submit">发送咨询 <i data-lucide="arrow-up-right"></i></button>
        <p id="contact-status" role="status"></p>
      </form>
    </dialog>
    <div class="toast" id="toast" role="status" hidden></div>
    <noscript><p class="no-script">案例搜索与详情需要启用 JavaScript。</p></noscript>
    <script type="module" src="/src/app.js"></script>
  </body>
</html>
